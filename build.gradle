plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.23'
}

group = 'dev.groundfog'
version = '1.0.0'

base {
    archivesName = 'groundfog'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // NeoForge для Minecraft 1.21.1
    version = '21.1.244'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        groundfog {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
